name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "cv.md"
      - "style.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Generate PDF
        run: npx md-to-pdf cv.md --stylesheet style.css --launch-options '{"args":["--no-sandbox"]}'
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p history
          mv cv.pdf "history/cv-$(date -u +%Y-%m-%dT%H-%M-%S).pdf"
          git add history/ --force
          git diff --staged --quiet || git commit -m "Update CV PDF" && git push
